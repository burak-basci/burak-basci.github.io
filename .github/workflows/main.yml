name: Build and Release APK
on: push
jobs:
  hosting:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
      # Checkout Repository
      - uses: actions/checkout@v1

      # Install Flutter command. Kept on current stable — the home
      # page lag investigated 2026-08-01 predates the 3.44 engine
      # (owner confirmed), so no reason to stay on the old pin.
      # font_awesome ^11 requires Dart >=3.9 (Flutter 3.44+).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      # Build Website
      - name: Build Website
        run: |
          flutter config --enable-web
          flutter pub get
          flutter build web --release
        working-directory: ./